<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2c3"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 80 H600 M0 160 H600 M0 240 H600 M0 320 H600" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M120 0 V400 M240 0 V400 M360 0 V400 M480 0 V400" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Glowing Orbs -->
  <circle cx="150" cy="180" r="100" fill="#00f2c3" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="450" cy="220" r="120" fill="#6366f1" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Decorative Shapes / Mobile Frame Outline -->
  <rect x="220" y="55" width="160" height="290" rx="28" fill="#111827" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="230" y="68" width="140" height="264" rx="20" fill="#0b0f19"/>
  <!-- Phone Notch & Elements -->
  <rect x="265" y="76" width="70" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
  <!-- App Activity Chart inside Phone -->
  <path d="M245 190 Q270 140 295 165 T350 130" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="350" cy="130" r="4" fill="#00f2c3"/>
  <rect x="245" y="215" width="110" height="14" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="245" y="238" width="80" height="10" rx="4" fill="rgba(255,255,255,0.05)"/>
  <!-- Metrics Card in Phone -->
  <rect x="245" y="260" width="50" height="50" rx="10" fill="rgba(0, 242, 195, 0.08)" stroke="rgba(0, 242, 195, 0.2)"/>
  <rect x="305" y="260" width="50" height="50" rx="10" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.2)"/>

  <!-- Brand Typography -->
  <text x="300" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="1">
    Fit<tspan fill="#00f2c3">Flix</tspan>
  </text>
  <text x="300" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="2">
    FLUTTER APP • BACKEND • MLOPS
  </text>
</svg>
