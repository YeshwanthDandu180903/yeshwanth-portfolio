<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chatplugBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="tealCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2c3"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="400" rx="16" fill="url(#chatplugBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600 M0 360 H600" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Glowing Ambiance -->
  <circle cx="180" cy="150" r="90" fill="#00f2c3" fill-opacity="0.14" filter="url(#glowG)"/>
  <circle cx="430" cy="240" r="110" fill="#6366f1" fill-opacity="0.15" filter="url(#glowG)"/>

  <!-- Central Multi-Tenant Architectural Visual -->
  <!-- Left Box: Ingestion / Multi-Tenants -->
  <g transform="translate(60, 110)">
    <rect width="130" height="170" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="65" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#38bdf8" letter-spacing="1">TENANT DATA</text>
    <rect x="18" y="50" width="94" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
    <text x="65" y="67" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">Tenant A (PDF)</text>
    <rect x="18" y="86" width="94" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
    <text x="65" y="103" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">Tenant B (DOCX)</text>
    <rect x="18" y="122" width="94" height="26" rx="6" fill="rgba(0,242,195,0.1)" stroke="rgba(0,242,195,0.3)"/>
    <text x="65" y="139" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#00f2c3">Tenant N (Isolated)</text>
  </g>

  <!-- Connecting Lines / Data Pipeline -->
  <path d="M190 195 H245" stroke="url(#tealCyanGrad)" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="245" cy="195" r="4" fill="#00f2c3"/>

  <!-- Center Hub: RAG + Vector Engine -->
  <g transform="translate(245, 100)">
    <rect width="110" height="190" rx="14" fill="#0b1120" stroke="url(#tealCyanGrad)" stroke-width="1.5"/>
    <rect x="15" y="20" width="80" height="34" rx="8" fill="rgba(220,36,76,0.15)" stroke="rgba(220,36,76,0.4)"/>
    <text x="55" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#f43f5e">Qdrant DB</text>

    <rect x="15" y="66" width="80" height="34" rx="8" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.4)"/>
    <text x="55" y="87" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#ef4444">Redis Cache</text>

    <rect x="15" y="112" width="80" height="34" rx="8" fill="rgba(51,103,145,0.2)" stroke="rgba(51,103,145,0.5)"/>
    <text x="55" y="133" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="10" fill="#60a5fa">PostgreSQL</text>

    <rect x="15" y="156" width="80" height="22" rx="6" fill="rgba(0,242,195,0.15)"/>
    <text x="55" y="171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="9" fill="#00f2c3">Groq Llama-3</text>
  </g>

  <!-- Connecting Lines to Embed Widget -->
  <path d="M355 195 H410" stroke="url(#accentPurple)" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="410" cy="195" r="4" fill="#a855f7"/>

  <!-- Right Box: Embed Widget -->
  <g transform="translate(410, 110)">
    <rect width="130" height="170" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="12" y="14" width="106" height="22" rx="6" fill="#1e293b"/>
    <text x="65" y="29" text-anchor="middle" font-family="monospace" font-size="9" fill="#a855f7">&lt;script&gt; embed</text>
    
    <!-- Chat Widget Bubble -->
    <rect x="14" y="48" width="85" height="30" rx="8" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)"/>
    <text x="22" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#e2e8f0">What is return policy?</text>
    <rect x="31" y="90" width="85" height="38" rx="8" fill="rgba(0,242,195,0.12)" stroke="rgba(0,242,195,0.3)"/>
    <text x="38" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#00f2c3">Accurate RAG Answer</text>
    <text x="38" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" fill="#94a3b8">Zero Hallucinations</text>
    
    <circle cx="106" cy="150" r="14" fill="#6366f1"/>
    <!-- Chat Icon inside bubble -->
    <path d="M102 147 H110 M102 151 H107" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="300" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="30" fill="#ffffff" letter-spacing="1">
    Chat<tspan fill="#00f2c3">plug</tspan>
  </text>
  <text x="300" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="2">
    MULTI-TENANT RAG SAAS PLATFORM
  </text>
  <text x="300" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#38bdf8" letter-spacing="2">
    FASTAPI • QDRANT • REDIS • POSTGRESQL • GROQ • DOCKER
  </text>
</svg>
